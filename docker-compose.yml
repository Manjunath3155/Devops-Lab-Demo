services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=devflow-secret-key-change-in-production
      - JENKINS_URL=http://host.docker.internal:8080
      - JENKINS_JOB_NAME=Devops-Lab-Demo
      - JENKINS_USER=manjunathpatil
      - JENKINS_TOKEN=Manjunath1234
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - devflow-data:/app/data
    networks:
      - devflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - devflow-network
    restart: unless-stopped

volumes:
  devflow-data:

networks:
  devflow-network:
    driver: bridge
